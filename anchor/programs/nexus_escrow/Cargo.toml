[package]
name = "nexus-escrow"
version = "0.1.0"
description = "Nexus-402 decentralized agent labor market escrow"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "nexus_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
